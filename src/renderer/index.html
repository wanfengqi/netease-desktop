<!DOCTYPE html>
<html lang="zh-CN" data-theme="default">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; media-src 'self' data: https: http: blob:; connect-src 'self' http://localhost:*;">
<title>网易云音乐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============ 自定义标题栏（无边框窗口）============ -->
<header class="titlebar">
  <div class="tb-left">
    <img class="logo" id="logo" src="icon.png" alt="鲸鱼">
    <span class="tb-title">网易云音乐 <em class="tb-sub">简易桌面版</em></span>
  </div>
  <div class="tb-drag"></div>
  <div class="tb-actions">
    <button class="tb-btn" id="btnLyric" data-icon="lyric" title="桌面歌词 (Ctrl+Alt+L)"></button>
    <button class="tb-btn" id="sleepBtn" data-icon="moon" title="睡眠定时"></button>
    <button class="tb-btn" id="btnTheme" data-icon="drop" title="更换皮肤"></button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="btnMin" data-icon="min" title="最小化"></button>
    <button class="tb-btn" id="btnMax" data-icon="max" title="最大化"></button>
    <button class="tb-btn tb-close" id="btnClose" data-icon="close" title="关闭"></button>
  </div>
</header>

<!-- ============ 主体 ============ -->
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="side-scroll">
      <div class="side-group">
        <div class="side-label">在线音乐</div>
        <nav class="nav">
          <div class="nav-item active" data-view="search">
            <span class="ni" data-icon="search"></span><span class="nav-text">搜索</span>
          </div>
          <div class="nav-item" data-view="recent">
            <span class="ni" data-icon="clock"></span><span class="nav-text">最近播放</span>
          </div>
        </nav>
      </div>
      <div class="side-group">
        <div class="side-label">我的音乐</div>
        <nav class="nav">
          <div class="nav-item" data-view="playlist">
            <span class="ni" data-icon="list"></span><span class="nav-text">播放列表</span>
            <span class="pill pill-ghost" id="sideQueueCount">0</span>
          </div>
          <div class="nav-item" data-view="favorites">
            <span class="ni" data-icon="heart"></span><span class="nav-text">我的收藏</span>
            <span class="pill pill-ghost" id="sideFavCount">0</span>
          </div>
          <div class="nav-item" data-view="login">
            <span class="ni" data-icon="user"></span><span class="nav-text">登录</span>
          </div>
        </nav>
      </div>
    </div>
    <div class="login-badge" id="loginBadge">未登录</div>
  </aside>

  <!-- 内容区 -->
  <main class="content">
    <!-- 搜索 -->
    <section class="view" id="view-search">
      <div class="searchbar">
        <div class="q-wrap">
          <span class="q-ico" data-icon="search"></span>
          <input id="q" placeholder="搜索歌曲 / 歌手 / 专辑…" autocomplete="off">
          <div class="q-history hidden" id="qHistory"></div>
        </div>
        <button id="btnSearch">搜索</button>
      </div>
      <div class="source-bar">
        <span class="src-label">音源</span>
        <div class="src-tabs" id="srcTabs">
          <button class="src-tab active" data-src="netease">网易云</button>
          <button class="src-tab" data-src="migu">咪咕</button>
        </div>
        <label class="src-hint" id="srcHint">网易云：需登录才能听 VIP 歌曲</label>
      </div>
      <div class="result-tabs" id="resultTabs">
        <button class="rtab active" data-tab="song">单曲</button>
        <button class="rtab" data-tab="playlist">歌单</button>
        <button class="rtab" data-tab="artist">歌手</button>
      </div>
      <div class="result-bar hidden" id="resultBar">
        <span class="rb-count" id="resultCount">找到 0 首</span>
        <div class="rb-actions">
          <button class="btn-pill" id="btnResPlayAll"><span data-icon="play"></span>播放全部</button>
          <button class="btn-pill" id="btnResShuffle"><span data-icon="shuffle"></span>随机播放</button>
        </div>
      </div>
      <div class="list" id="results"></div>
    </section>

    <!-- 歌手主页 -->
    <section class="view hidden" id="view-artist">
      <div class="hero">
        <div class="hero-bg" id="arBg"></div>
        <div class="hero-inner">
          <button class="btn-icon hero-back" id="btnArBack" data-icon="chevronL" title="返回"></button>
          <img class="ar-avatar" id="arAvatar" alt="">
          <div class="hero-meta">
            <div class="hero-kicker">歌手</div>
            <div class="ar-name" id="arName">—</div>
            <div class="ar-stats" id="arStats">—</div>
            <div class="ar-brief" id="arBrief"></div>
          </div>
        </div>
      </div>
      <div class="ar-tabs">
        <button class="artab active" data-ar="album">专辑 <span id="arAlbumCount" class="pill">0</span></button>
        <button class="artab" data-ar="song">热门歌曲</button>
      </div>
      <div class="list" id="arBody"></div>
    </section>

    <!-- 歌单 / 专辑详情 -->
    <section class="view hidden" id="view-pl">
      <div class="hero">
        <div class="hero-bg" id="plBg"></div>
        <div class="hero-inner">
          <button class="btn-icon hero-back" id="btnPlBack" data-icon="chevronL" title="返回"></button>
          <img class="pl-cover" id="plCover" alt="">
          <div class="hero-meta">
            <div class="hero-kicker">歌单</div>
            <div class="pl-name" id="plName">—</div>
            <div class="pl-info" id="plInfo">—</div>
            <div class="hero-actions">
              <button class="btn-primary" id="btnPlPlayAll"><span data-icon="play"></span>播放全部</button>
              <button class="btn-ghost" id="btnPlShuffle"><span data-icon="shuffle"></span>随机播放</button>
            </div>
          </div>
        </div>
      </div>
      <div class="list" id="plSongs"></div>
    </section>

    <!-- 播放列表 -->
    <section class="view hidden" id="view-playlist">
      <div class="pl-head-bar">
        <h2 class="vtitle">当前播放列表 <span id="plCount" class="pill">0</span>
          <span class="vtitle-hint">拖动可调整播放顺序</span>
        </h2>
        <div class="pl-actions">
          <button class="btn-ghost" id="btnClearQueue"><span data-icon="trash"></span>清空列表</button>
          <button class="btn-primary" id="btnShufflePlay"><span data-icon="shuffle"></span>随机播放</button>
        </div>
      </div>
      <div class="list" id="plist"></div>
    </section>

    <!-- 我的收藏 -->
    <section class="view hidden" id="view-favorites">
      <div class="pl-head-bar">
        <h2 class="vtitle">我的收藏 <span id="favCount" class="pill">0</span></h2>
        <div class="pl-actions">
          <button class="btn-ghost" id="btnFavClearAll"><span data-icon="trash"></span>清空收藏</button>
          <button class="btn-primary" id="btnFavPlayAll"><span data-icon="play"></span>播放全部</button>
        </div>
      </div>
      <div class="list" id="favList"></div>
    </section>

    <!-- 最近播放 -->
    <section class="view hidden" id="view-recent">
      <div class="pl-head-bar">
        <h2 class="vtitle">最近播放 <span id="recentCount" class="pill">0</span>
          <span class="vtitle-hint">按播放先后排序，最多保留 200 首</span>
        </h2>
        <div class="pl-actions">
          <button class="btn-ghost" id="btnRecentClear"><span data-icon="trash"></span>清空记录</button>
          <button class="btn-primary" id="btnRecentPlayAll"><span data-icon="play"></span>播放全部</button>
        </div>
      </div>
      <div class="list" id="recentList"></div>
    </section>

    <!-- 登录 -->
    <section class="view hidden" id="view-login">
      <!-- 已登录：显示账号 -->
      <div id="accountSection" class="hidden">
        <h2 class="vtitle">我的账号</h2>
        <div class="account-card">
          <img class="account-avatar" id="accAvatar" alt="">
          <div class="account-meta">
            <div class="account-nick" id="accNick">—</div>
            <div class="account-sub" id="accSub">—</div>
          </div>
          <button class="btn-ghost" id="btnLogout">退出登录</button>
        </div>
        <div class="account-hint">登录状态已保存在本机，下次打开无需重新扫码</div>
      </div>

      <!-- 未登录：扫码 -->
      <div id="qrSection" class="hidden">
        <h2 class="vtitle">扫码登录</h2>
        <div class="login-box">
          <div class="qr-wrap"><img id="qrImg" alt="二维码"><div class="qr-mask" id="qrMask">加载中…</div></div>
          <div class="login-tip" id="loginTip">用网易云音乐 App 扫码登录</div>
          <button class="btn-ghost" id="btnQrRefresh"><span data-icon="refresh"></span>刷新二维码</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ============ 播放条 ============ -->
<footer class="player">
  <div class="now" id="nowBox" title="点击打开歌词页">
    <img id="cover" class="cover" alt="">
    <div class="now-meta">
      <div class="now-title" id="nowTitle">未在播放</div>
      <div class="now-artist" id="nowArtist">—</div>
    </div>
    <span class="now-expand" data-icon="chevronU"></span>
  </div>

  <div class="controls">
    <button id="btnMode" class="cbtn cbtn-sm" data-icon="repeat" title="列表循环（点击切换）"></button>
    <button id="btnPrev" class="cbtn" data-icon="prev" title="上一首"></button>
    <button id="btnPlay" class="cbtn cbtn-main" data-icon="play" title="播放/暂停 (空格)"></button>
    <button id="btnNext" class="cbtn" data-icon="next" title="下一首"></button>
  </div>

  <div class="progress">
    <span id="tCur">0:00</span>
    <div class="bar" id="bar">
      <div class="bar-buf" id="barBuf"></div>
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-dot" id="barDot"></div>
    </div>
    <span id="tDur">0:00</span>
  </div>

  <div class="vol">
    <button id="btnMute" class="cbtn cbtn-sm" data-icon="volume" title="静音 (M)"></button>
    <input type="range" id="vol" min="0" max="100" value="70">
  </div>
</footer>

<audio id="audio" preload="none"></audio>

<!-- ============ 歌词详情页 ============ -->
<div class="np-overlay hidden" id="npOverlay">
  <div class="np-bg" id="npBg"></div>
  <div class="np-inner">
    <!-- 顶栏 -->
    <div class="np-top">
      <button class="np-btn np-back" id="npClose" title="收起 (Esc)"><span data-icon="chevronD"></span></button>
      <div class="np-top-title" id="npTopTitle">—</div>
      <div class="np-lyric-tools" title="歌词比声音快/慢时可以微调时轴">
        <span class="nlt-label" data-icon="text"></span>
        <button class="nlt-btn" id="npOffsetMinus" title="歌词提前 0.5 秒">−</button>
        <span class="np-offset" id="npOffsetLabel">0.0s</span>
        <button class="nlt-btn" id="npOffsetPlus" title="歌词延后 0.5 秒">＋</button>
        <button class="nlt-btn" id="npOffsetReset" data-icon="refresh" title="重置歌词偏移"></button>
      </div>
      <button class="np-btn" id="npDesktopLyric" data-icon="lyric" title="桌面歌词"></button>
    </div>

    <!-- 主体：左封面右歌词 -->
    <div class="np-body">
      <div class="np-left">
        <div class="np-cover-wrap">
          <img class="np-cover" id="npCover" alt="">
        </div>
        <div class="np-info">
          <div class="np-title" id="npTitle">未在播放</div>
          <div class="np-artist" id="npArtist">—</div>
          <div class="np-album" id="npAlbum"></div>
        </div>

        <!-- 进度 -->
        <div class="np-progress">
          <span id="npCur">0:00</span>
          <div class="np-bar" id="npBar">
            <div class="np-bar-buf" id="npBarBuf"></div>
            <div class="np-bar-fill" id="npBarFill"></div>
            <div class="np-bar-dot" id="npBarDot"></div>
          </div>
          <span id="npDur">0:00</span>
        </div>

        <!-- 控制 -->
        <div class="np-controls">
          <button class="np-cbtn" id="npMode" data-icon="repeat" title="播放模式"></button>
          <button class="np-cbtn" id="npPrev" data-icon="prev" title="上一首"></button>
          <button class="np-cbtn np-main" id="npPlay" data-icon="play" title="播放/暂停"></button>
          <button class="np-cbtn" id="npNext" data-icon="next" title="下一首"></button>
          <button class="np-cbtn np-fav" id="npFav" data-icon="heart" title="收藏"></button>
          <div class="np-vol">
            <button class="np-cbtn np-sm" id="npMute" data-icon="volume" title="静音"></button>
            <input type="range" id="npVol" min="0" max="100" value="70">
          </div>
        </div>
      </div>

      <!-- 歌词 -->
      <div class="np-right">
        <div class="np-lyric-scroll" id="npLyricScroll">
          <div class="np-lyric-inner" id="npLyricInner"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 皮肤面板 ============ -->
<div class="theme-overlay hidden" id="themeOverlay">
  <div class="theme-panel">
    <div class="tp-head">
      <h3>更换皮肤</h3>
      <button class="tb-btn" id="btnThemeClose" data-icon="close"></button>
    </div>

    <div class="tp-section">
      <div class="tp-label">内置皮肤</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="tp-section">
      <div class="tp-label">从封面取色</div>
      <div class="tp-hint">用当前播放歌曲的封面自动生成一套皮肤</div>
      <button class="btn-primary" id="btnFromCover">用当前封面生成皮肤</button>
    </div>

    <div class="tp-section">
      <div class="tp-label">自定义主色</div>
      <div class="color-row">
        <input type="color" id="colorPick" value="#2b7de9">
        <input type="text" id="colorHex" value="#2b7de9" spellcheck="false">
        <button class="btn-primary" id="btnFromColor">生成</button>
      </div>
    </div>

    <div class="tp-section">
      <div class="tp-label">我的皮肤</div>
      <div class="theme-grid" id="customGrid"><div class="tp-hint">还没有自定义皮肤</div></div>
    </div>

    <div class="tp-foot">
      <button class="btn-ghost" id="btnResetTheme">恢复默认皮肤</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<!-- 加载顺序有讲究：底层能力在前，app.js 最后启动 -->
<script src="themes.js"></script>
<script src="icons.js"></script>
<script src="normalize.js"></script>
<script src="migu.js"></script>
<script src="ui.js"></script>
<script src="player.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
